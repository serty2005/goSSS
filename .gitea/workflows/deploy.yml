name: Deploy Etalon Server

# Триггер: запускать workflow при пуше в ветку 'main'
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    # Запускать на последней версии Ubuntu, предоставляемой ранером
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Получение исходного кода из репозитория
      - name: Checkout code
        uses: actions/checkout@v3

      # Шаг 2: Настройка окружения Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.4'


      # Шаг 4: Логин в Docker Hub с использованием секретов Gitea
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Шаг 5: Сборка Docker-образа и отправка его в репозиторий
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # ВАЖНО: Замените 'serty2005' на ваш логин в Docker Hub
          tags: serty2005/etalon-server:latest

      # Шаг 6: Развертывание на продакшен-сервере по SSH
      - name: Deploy to Production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Создаем или обновляем .env файл на сервере из секрета Gitea
            # ВАЖНО: Укажите правильный путь к директории вашего приложения на сервере
            APP_DIR="/opt/etalon-server"
            mkdir -p $APP_DIR/logs
            mkdir -p $APP_DIR/ftp_cache
            echo "${{ secrets.ENV_FILE_CONTENT }}" | base64 -d > $APP_DIR/.env

            # Останавливаем и удаляем старый контейнер, если он существует
            docker stop etalon-server || true
            docker rm etalon-server || true

            # Принудительно скачиваем свежую версию образа
            docker pull serty2005/etalon-server:latest

            # Запускаем новый контейнер
            docker run -d \
              --name etalon-server \
              --restart unless-stopped \
              -p 8080:8080 \
              -v $APP_DIR/logs:/root/logs \
              -v $APP_DIR/ftp_cache:/root/ftp_cache \
              --env-file $APP_DIR/.env \
              serty2005/etalon-server:latest