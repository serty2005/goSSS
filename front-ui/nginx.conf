server {
    listen 80;
    server_name localhost;
    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json;

    root /usr/share/nginx/html;
    index index.html;

    # Явно рубим типовые сканерные запросы
    location = /.env { return 404; }
    location = /.env.local { return 404; }
    location = /.git/config { return 404; }
    location ^~ /.git/ { return 404; }
    location ^~ /.vscode/ { return 404; }
    location = /@vite/env { return 404; }
    location = /wp-login.php { return 404; }
    location = /xmlrpc.php { return 404; }
    location ^~ /vendor/phpunit/ { return 404; }
    location ^~ /cgi-bin/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location = /server-status { return 404; }

    # SSE
    location = /api/events {
        proxy_pass http://server:8080/api/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no;
        gzip off;
    }

    # API
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
