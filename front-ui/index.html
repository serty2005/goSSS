<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" />  -->
    <!-- Примечание: favicon можно заменить позже, пока оставим ссылку или уберем, если удалили файл -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyHoreca XenionDesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var locale = String(params.get('locale') || '').trim().toLowerCase();
          if (locale === 'en' || locale === 'ru') {
            window.localStorage.setItem('etalon-ui-locale', locale);
            document.documentElement.lang = locale;
          }
        } catch (error) {
          console.warn('Не удалось применить locale из URL до инициализации UI', error);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
