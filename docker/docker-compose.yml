
name: etalon
services:
  # 1. База данных
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ${HOST_PROJECT_PATH}/etalon-mcp/init-mcp-user.sh:/docker-entrypoint-initdb.d/99-init-mcp.sh
    ports:
      - "5456:5432"
    networks:
      - etalon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Инициализатор (Сидер)
  init-seeder:
    container_name: seeder
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    command: ["./etalon-server", "--seed"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - etalon-net

  # 3. Основной сервер
  server:
    container_name: server
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9999:8080"
    depends_on:
      db:
        condition: service_healthy
      init-seeder:
        condition: service_completed_successfully
    volumes:
      # Монтируем папку из корня проекта внутрь контейнера
      - ${HOST_PROJECT_PATH}/ftp_cache:/app/ftp_cache
    networks:
      - etalon-net

  # 4. Фронт
  frontend:
    container_name: frontend
    build:
      # Путь относительно docker-compose.yml к папке фронта
      context: ../front-ui 
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Маппим 5173 хоста на 80 порт Nginx внутри
      - "80:80"
    depends_on:
      - server
    networks:
      - etalon-net

  mcp:
    build:
      context: ../etalon-mcp
      dockerfile: Dockerfile
    container_name: mcp
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${MCP_DB_USER}:${MCP_DB_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - CODEBASE_PATH=/app/codebase
    volumes:
      - ${HOST_PROJECT_PATH}:/app/codebase:ro
    networks:
      - etalon-net

volumes:
  pg_data:

networks:
  etalon-net:
    driver: bridge