name: gosss-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gosss-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gosss-net

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gosss-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:${MINIO_CONSOLE_PORT:-9001}/}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
      - "9000:9000"
    networks:
      - gosss-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    restart: "no"
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'until mc alias set local http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"; do echo "Ожидание готовности MinIO..."; sleep 2; done; mc mb --ignore-existing "local/${AGENT_ADAPTER_CATALOG_BUCKET}"; mc anonymous set download "local/${AGENT_ADAPTER_CATALOG_BUCKET}"; if [ -n "${MEGAFON_VATS_RECORDINGS_BUCKET}" ]; then mc mb --ignore-existing "local/${MEGAFON_VATS_RECORDINGS_BUCKET}"; mc anonymous set download "local/${MEGAFON_VATS_RECORDINGS_BUCKET}"; fi'
    depends_on:
      - minio
    networks:
      - gosss-net

  agents-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles:
      - agents-proxy
    depends_on:
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${AGENTS_PROXY_PORT:-8081}:80"
    volumes:
      - ./docs/nginx-agents-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gosss-net

volumes:
  pg_data:
  redis_data:
  nats_data:
  minio_data:
  ftp_cache:

networks:
  gosss-net:
    driver: bridge
