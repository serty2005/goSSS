name: gosss-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gosss-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gosss-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
      - "9000:9000"
    networks:
      - gosss-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    restart: "no"
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'until mc alias set local http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"; do echo "Ожидание готовности MinIO..."; sleep 2; done; mc mb --ignore-existing "local/${AGENT_ADAPTER_S3_BUCKET}"; mc anonymous set download "local/${AGENT_ADAPTER_S3_BUCKET}"'
    depends_on:
      - minio
    networks:
      - gosss-net

  server:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-9999}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ftp_cache:/app/ftp_cache
      - storage_tickets:/app/storage/tickets
      - app_logs:/app/logs
    networks:
      - gosss-net

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - gosss-net

  agents-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles:
      - agents-proxy
    depends_on:
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${AGENTS_PROXY_PORT:-8081}:80"
    volumes:
      - ./docs/nginx-agents-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gosss-net

  init-seeder:
    image: ${BACKEND_IMAGE}
    profiles:
      - seed
    env_file:
      - .env
    command: ["--seed"]
    volumes:
      - storage_tickets:/app/storage/tickets
      - type: bind
        source: ${SEEDER_MOCK_DATA_PATH:-/opt/gosss/mock_data}
        target: /app/tools/seeder/mock_data
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gosss-net

volumes:
  pg_data:
  redis_data:
  minio_data:
  ftp_cache:
  storage_tickets:
  app_logs:

networks:
  gosss-net:
    driver: bridge
